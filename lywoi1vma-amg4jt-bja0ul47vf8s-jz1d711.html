<script>
(function () {
  var ID = '1Y-f7C6GUgDtAghaDlIf94HYMJb1LS4IizFGXFJwCFDc', GID = '0';
  var box = document.getElementById('sheet');
  var done = false;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function fail() {
    if (done) return;
    done = true;
    box.innerHTML = '<p class="sheet-status">Не удалось загрузить таблицу. Проверьте, что доступ по ссылке открыт, или откройте её по кнопке ниже.</p>';
  }
  function val(c) { return c && c.v != null ? String(c.v).trim() : ''; }

  function render(res) {
    if (done) return;
    if (!res || res.status === 'error' || !res.table) { fail(); return; }
    done = true;
    var rows = res.table.rows.map(function (r) {
      var out = [];
      for (var i = 1; i <= 5; i++) out.push(val(r.c && r.c[i]));
      return out;
    });
    var head = null;
    for (var i = 0; i < rows.length; i++) {
      if (/^ник$/i.test(rows[i][0])) { head = rows[i]; rows = rows.slice(i + 1); break; }
    }
    if (!head) {
      head = [1, 2, 3, 4, 5].map(function (k) { return (res.table.cols[k] && res.table.cols[k].label) || ''; });
    }
    rows = rows.filter(function (r) { return r.some(function (x) { return x; }); });

    var html = '<table class="sheet-table"><thead><tr>';
    head.forEach(function (t) { html += '<th>' + esc(t) + '</th>'; });
    html += '</tr></thead><tbody>';
    rows.forEach(function (r) {
      html += '<tr>';
      r.forEach(function (t, k) { html += '<td' + (k === 1 ? ' class="id"' : '') + '>' + esc(t) + '</td>'; });
      html += '</tr>';
    });
    box.innerHTML = html + '</tbody></table>';
  }

  window.google = window.google || {};
  google.visualization = google.visualization || {};
  google.visualization.Query = google.visualization.Query || {};
  google.visualization.Query.setResponse = render;

  var s = document.createElement('script');
  s.src = 'https://docs.google.com/spreadsheets/d/' + ID + '/gviz/tq?gid=' + GID + '&tqx=out:json';
  s.onerror = fail;
  document.head.appendChild(s);
  setTimeout(fail, 12000);
})();
</script>
